name: Publish Fitimart release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Build Pages artifact for release
        env:
          NEXT_PUBLIC_BASE_PATH: /fitimart
        run: npm run build
      - name: Package static export and checksum
        shell: bash
        run: |
          mkdir -p release
          archive="fitimart-${GITHUB_REF_NAME}-pages.tar.gz"
          tar -C out -czf "release/${archive}" .
          cd release
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Fitimart ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.tar.gz
            release/*.sha256
