name: Live feed and translation acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: live-feeds
  cancel-in-progress: true

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build root static export
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Live RSS, Atom, JSON Feed, proxy, and translation acceptance
        run: python tests/live-feeds.spec.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fitimart-live-service-evidence
          path: work/live-feeds/
          if-no-files-found: warn
