name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Static export
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Accept the built demo checkout in Chromium
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python scripts/check_browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-browser
          path: work/dependency-browser/
          if-no-files-found: error
