name: Fitimart CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit, parser, migration, and service tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Static export at root
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Offline browser acceptance and legacy migration
        run: python scripts/check_browser.py
      - name: Static export under GitHub Pages subpath
        env:
          NEXT_PUBLIC_BASE_PATH: /fitimart
        run: npm run build
      - name: GitHub Pages subpath acceptance
        run: python tests/pages-subpath.spec.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fitimart-browser-evidence
          path: |
            work/dependency-browser/
            work/live-feeds/
          if-no-files-found: warn
